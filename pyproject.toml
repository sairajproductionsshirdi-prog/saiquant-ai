[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saiquant-ai"
version = "0.1.0"
description = "Safe, approval-based paper trading assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["saiquant*"]
