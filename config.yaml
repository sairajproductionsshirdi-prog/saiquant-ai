# ─── SaiQuant AI v7 configuration ─────────────────────────────────────────
mode: paper

# ⚠️ REAL-MONEY SWITCH. Keep false until you have >= 15 closed paper trades
# with a positive expectancy. Requires Kite Connect subscription (₹2000/mo),
# KITE_API_KEY / KITE_API_SECRET in .env, and daily login.
live_trading: false

# Analysis style: positional (daily candles, swing) or intraday (15-min candles)
intraday: false

paper_capital: 50000

# ─── Watchlist groups ─────────────────────────────────────────────────────
